services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - inventory_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - "127.0.0.1:8083:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://inventory:${POSTGRES_PASSWORD}@db:5432/inventory
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8083,http://127.0.0.1:8083}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
volumes:
  inventory_postgres:
