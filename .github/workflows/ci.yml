name: Verify inventory ERP
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend development dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Check Python formatting and lint
        working-directory: backend
        run: |
          ruff check app tests migrations
          ruff format --check app tests migrations
      - name: Verify formulas and API workflows
        working-directory: backend
        run: |
          pytest -q
          alembic upgrade head
          alembic check
      - name: Build dashboard
        working-directory: frontend
        run: |
          npm ci
          npm run format:check
          npm run build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build deployment image
        run: docker build -t inventory-reorder-erp:test .
